[project]
name = "career-readiness-ai-service"
version = "1.0.0"
description = "FastAPI AI Intelligence Service with Gemini 3.5 Flash Lite and LangGraph"
authors = [{ name = "Career Readiness Engineering Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-google-genai>=2.0.4",
    "langgraph>=0.2.45",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
